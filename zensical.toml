[project]
site_name = "Material de estudos de Plataformas & Microsserviços"
site_description = "Material de estudo para a prova final de Plataformas, Microsserviços, DevOps e APIs, baseado nas aulas de 2026.2 e no projeto Microsserv52."
site_author = "Guia de estudo"
site_url = ""
repo_url = ""
repo_name = ""

docs_dir = "docs"
site_dir = "site"

extra_css = ["assets/katex/katex.min.css", "stylesheets/extra.css"]
extra_javascript = ["javascripts/math.js", "javascripts/study.js"]

nav = [
  { "Início" = "index.md" },
  { "0. Mapa da matéria" = "00-mapa.md" },
  { "1. O projeto por dentro" = "01-projeto.md" },
  { "2. Sistemas distribuídos" = "02-distribuidos.md" },
  { "3. Containers e Compose" = "03-containers.md" },
  { "4. APIs e contratos" = "04-apis.md" },
  { "5. Microsserviços e DDD" = "05-microsservicos-ddd.md" },
  { "6. Arquiteturas de software" = "06-arquiteturas.md" },
  { "7. Segurança e identidade" = "07-seguranca.md" },
  { "8. Eventos e mensageria" = "08-eventos.md" },
  { "9. Confiabilidade e SLOs" = "09-confiabilidade.md" },
  { "10. Kubernetes e HA" = "10-kubernetes-ha.md" },
  { "11. Observabilidade" = "11-observabilidade.md" },
  { "12. Nuvem, deploy e custos" = "12-nuvem-custos.md" },
  { "13. Performance e gargalos" = "13-performance-gargalos.md" },
  { "14. Frontend e entrega" = "14-frontend.md" },
  { "15. Estudo de caso ponta a ponta" = "15-estudo-de-caso.md" },
  { "16. Simulado e banco de questões" = "16-simulado.md" },
  { "17. Glossário e cheatsheet" = "17-glossario-cheatsheet.md" },
  { "18. O que não foi implementado" = "18-lacunas-e-evolucao.md" },
  { "19. Respostas" = "19-respostas.md" },
]

[project.extra]
generator = false

[project.theme]
language = "pt"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
# Sem Google Fonts: usa a pilha do sistema (privacidade, offline e menos requests).
font = false

features = [
  "announce.dismiss",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Alternar tema"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Usar tema claro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Usar tema escuro"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
